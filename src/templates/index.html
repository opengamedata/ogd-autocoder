{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-end gap-3 mb-3">
    <button class="btn btn-primary" id="downloadBtn" style="display:none;">
      <i class="bi bi-download me-1"></i> Download
    </button>
  </div>
  <h2 class="mb-4 text-center">SE6MEN7AT0R</h2>
  
  <div class="d-flex align-items-center gap-3 mb-4">
    <button class="btn btn-primary" style="min-width: 100px;" onclick="triggerFilePicker()">Load TSV</button>
    <input type="file" id="tsvFile" accept=".tsv" style="display: none;">
    <select 
      class="form-select" 
      id="userDropdown" 
      onchange="loadEvents()" 
      style="min-width: 200px; display:none;">
    </select>
  </div>

  <div id="spinner" class="d-none position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-white bg-opacity-50" style="z-index: 10;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div> 
  <!-- Events Table -->
  <div id="eventsTableDiv" style="display:none;">
    <div class="d-flex justify-content-start gap-4 mb-3">
      <div class="input-group mb-3">
        <span class="input-group-text">Segmentation</span>
        <input type="number" class="form-control" id="segmentIdInput" placeholder="Segment ID" aria-label="Segment ID">
        <button class="btn btn-primary" type="button" onclick="updateRows(true)">Apply</button>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text">Labeling</span>
        <input type="text" class="form-control" id="segmentLabelsInput" placeholder="Struggle, Bored..." aria-label="Labels">
        <button class="btn btn-primary" type="button" onclick="updateRows(false)">Apply</button>
      </div>
    </div>
    <table id="eventsTable" class="table table-striped table-bordered" style="width:100%">
      <thead>
        <tr>
          <th>Index</th>
          <th>Event Name</th>
          <th>Job Name</th>
          <th>Time</th>
          <th>Segment ID</th>
          <th>Segment labels</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="/static/js/index.js"></script>
{% endblock %}
